; PlatformIO project configuration for the Selfbus KNXnet/IP interface.
;
; The KNX TP1 side is a Selfbus SB-Interface (LPC1115) running the TP-UART 2
; emulator from ../TPUART2-Emu. It is attached to a hardware UART of the ESP32
; at 19200 baud, 8E1.
;
; Deliberately NOT set (unlike NCN5130-based gateways):
;   -DNCN5120       the LPC1115 emulates a plain TP-UART 2, not an NCN512x.
;                   Setting it would make the stack expect U_Configure,
;                   marker mode, a baud rate switch to 38400 and the analog
;                   registers - none of which the emulator implements.
;   -DKNX_BAUDRATE  stays at the TP-UART 2 default of 19200.

[platformio]
src_dir = src
include_dir = include

; Which product identity the firmware presents to ETS. Swap the two lines
; below to switch; the values themselves live in include/interface_config.h.
;
;   own  manufacturer 0x00FA, no product database. Tunnelling works, coupler
;        commissioning does not - see README, "Konfiguration ueber die ETS".
;        This is the base for an own knxprod built with Kaenx.
;   abb  emulates the ABB i-bus KNX IP Router IPR/S 3.1.1, whose knxprod and
;        product manual are in docs/. Same mask version 091A this firmware
;        already builds, so only the identity and the tunnel count differ.
;
; KNX_TUNNELING belongs here because the count has to match the product data:
; ETS manages exactly as many tunnel addresses as the application declares.
[knx_product]
;flags = -DSBIP_KNX_PRODUCT=0 -DKNX_TUNNELING=10
flags = -DSBIP_KNX_PRODUCT=1 -DKNX_TUNNELING=5

[env]
; Arduino-ESP32 3.x is a hard requirement, not a preference:
;   * ETH.begin(ETH_PHY_W5500, ..., SPI, ...), ETH.hasIP() and ETH.setDefault()
;     used by src/eth_interface.cpp only exist from core 3.x on. Core 2.0.x
;     drives RMII PHYs only and cannot talk to a W5500 at all.
;   * WiFiUDP is a typedef on NetworkUDP there, which is what lets the KNX
;     stack run unchanged over Ethernet (see README).
;   * src/fw_hash.cpp calls the mbedTLS 3.x SHA-256 API (ESP-IDF 5.x).
; The registry's espressif32 platform still ships core 2.0.x, so the core 3.x
; builds are pulled from pioarduino. Bump the release tag to move core version.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
lib_ldf_mode = deep+
; framework_includes.py works around the core 3.x libraries not declaring
; their dependencies on each other - see the file header for details.
extra_scripts =
    pre:scripts/version_bump.py
    pre:scripts/framework_includes.py
    pre:scripts/patch_knx.py

board_build.partitions = partitions_4mb_ota.csv
board_upload.flash_size = 4MB

; Our own sources keep the volatile check that build_flags switches off for
; the libraries below. A ++ on a volatile here would be a genuine hint at a
; non-atomic read-modify-write shared with an ISR.
build_src_flags = -Wvolatile

lib_deps =
    ; The KNX stack. Pin to a commit rather than a floating branch - the
    ; TpUartDataLinkLayer was rewritten upstream and the API used in
    ; src/knx_link.cpp (isConnected/getRx*Counter/reset) only exists in the
    ; new implementation.
    https://github.com/thelsing/knx.git#master
    ESP32Async/ESPAsyncWebServer @ ^3.6.0
    ESP32Async/AsyncTCP @ ^3.3.2
    https://github.com/jnthas/Improv-WiFi-Library.git

build_flags =
    ; Product identity and tunnel count, see the [knx_product] section above.
    ${knx_product.flags}
    ; KNXnet/IP router + tunnelling server (coupler mask 091A).
    ;
    ; Each tunnel needs its own individual address; while the device is
    ; unprogrammed the stack derives them from its own subnet
    ; (15.15.1 .. 15.15.n). Cost is about 24 bytes of RAM plus 7 bytes of
    ; property data per tunnel, so the practical limit is the address range,
    ; not the ESP32.
    -DMASK_VERSION=0x091A
    -DKNX_ROUTING
    ; Size of the KNX non volatile area, backed by the knxcfg partition (see
    ; partitions_4mb_ota.csv). The default of 1 KiB cannot hold a filter table:
    ; main groups 0-13 need 3.5 KiB, 0-31 need 8 KiB, plus the parameter
    ; segment and the address and association tables.
    -DKNX_FLASH_SIZE=16384
    ; Per-frame RX/TX notifications, used for the bus statistics on the
    ; dashboard. Without this the stack exposes frame counters only.
    -DKNX_ACTIVITYCALLBACK
    ; We create the KnxFacade ourselves in knx_link.cpp so the UART can be
    ; picked at runtime. KNX_SERIAL still has to be defined or esp32_platform
    ; emits a warning; the value is unused because we pass the port explicitly.
    -DKNX_NO_AUTOMATIC_GLOBAL_INSTANCE
    -DKNX_SERIAL=Serial1
    ; The Arduino core runs its network event callbacks in a task with a 4 kB
    ; stack (NetworkEvents.cpp). Bringing up the provisioning AP fires several
    ; events at once and overflowed it, which showed up as a corrupted return
    ; address inside the task entry lambda:
    ;   Core 1 panic'ed (Cache disabled but cached memory region accessed)
    ;   #1 NetworkEvents::initNetworkEvents()::{lambda(void*)#1}::_FUN
    ; Costs 4 kB of RAM, of which the firmware uses well under a fifth.
    -DARDUINO_NETWORK_EVENT_TASK_STACK_SIZE=8192

[env:esp32dev]
board = esp32dev
build_flags =
    ${env.build_flags}
    -DSBIP_KNX_UART_NUM=2
    -DSBIP_KNX_RX_PIN=16
    -DSBIP_KNX_TX_PIN=17
    -DSBIP_LED_PIN=2
    -DSBIP_LED_ACTIVE_LOW=0
    -DSBIP_BUTTON_PIN=0
    -DSBIP_I2C_SDA_PIN=21
    -DSBIP_I2C_SCL_PIN=22
    ; Optional W5500 on VSPI. Probed at boot; without a chip these pins stay
    ; unused and the firmware falls back to WiFi.
    -DSBIP_ETH_SCK_PIN=18
    -DSBIP_ETH_MISO_PIN=19
    -DSBIP_ETH_MOSI_PIN=23
    -DSBIP_ETH_CS_PIN=5

[env:esp32c3]
board = seeed_xiao_esp32c3
; No Ethernet pins: the XIAO C3 breaks out 11 GPIOs and KNX-UART, I2C, LED and
; button already claim six of them. Wire a W5500 on a board with more pins, or
; drop I2C/RTC here and reassign.
build_flags =
    ${env.build_flags}
    -DSBIP_KNX_UART_NUM=1
    -DSBIP_KNX_RX_PIN=20
    -DSBIP_KNX_TX_PIN=21
    -DSBIP_LED_PIN=4
    -DSBIP_LED_ACTIVE_LOW=1
    -DSBIP_BUTTON_PIN=9
    -DSBIP_I2C_SDA_PIN=6
    -DSBIP_I2C_SCL_PIN=7
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:esp32c6]
board = esp32-c6-devkitc-1
; Ethernet pins intentionally unset - see the C3 note. The DevKitC has spare
; GPIOs, so add -DSBIP_ETH_* here if you fit a W5500.
build_flags =
    ${env.build_flags}
    -DSBIP_KNX_UART_NUM=1
    -DSBIP_KNX_RX_PIN=5
    -DSBIP_KNX_TX_PIN=4
    ; Same as the S3: GPIO 8 is the WS2812 RGB LED on the DevKitC-1, not a
    ; plain output. Disabled rather than pretending it works.
    -DSBIP_LED_PIN=-1
    -DSBIP_LED_ACTIVE_LOW=1
    -DSBIP_BUTTON_PIN=9
    -DSBIP_I2C_SDA_PIN=6
    -DSBIP_I2C_SCL_PIN=7
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
monitor_filters = esp32_exception_decoder

; ESP32-S3. Plenty of RAM and two free UARTs, the most comfortable target.
[env:esp32s3]
board = esp32-s3-devkitc-1
; The board definition defaults to the N8 variant, which has no PSRAM. An
; N8R8 carries 8 MB of octal PSRAM, and without this it stays invisible.
; Costs GPIO 35, 36 and 37: octal PSRAM talks to the module over them, so
; they are no longer available for anything else.
board_build.arduino.memory_type = qio_opi
build_flags =
    ${env.build_flags}
    -DBOARD_HAS_PSRAM
    -DSBIP_KNX_UART_NUM=1
    -DSBIP_KNX_RX_PIN=18
    -DSBIP_KNX_TX_PIN=17
    ; No plain status LED on this board: the only indicator is an addressable
    ; SK68 RGB LED, which needs a timed serial protocol - digitalWrite() does
    ; nothing visible there. -1 disables the plain indicator; the RGB LED
    ; below takes over that job.
    ;
    ; CAREFUL: the pin depends on the board revision. v1.0 drives the RGB LED
    ; from GPIO 48, v1.1 from GPIO 38, and both are on the market. If the LED
    ; stays dark, change it in the dashboard - no rebuild needed.
    -DSBIP_LED_PIN=-1
    -DSBIP_LED_ACTIVE_LOW=0
    -DSBIP_RGB_PIN=48
    -DSBIP_RGB_TYPE=1
    -DSBIP_BUTTON_PIN=0
    -DSBIP_I2C_SDA_PIN=8
    -DSBIP_I2C_SCL_PIN=9
    ; ISP control lines to the SB-Interface, alongside the KNX UART. GPIO 4
    ; and 5 are among the few pins on this board with no second job: not
    ; strapping, not flash or PSRAM (26-37), not USB (19/20), not JTAG
    ; (39-42), not UART0 (43/44) and not the RGB LED (38/48). Both come out
    ; of reset as floating inputs, which is what an open drain line to a
    ; running LPC needs.
    -DSBIP_LPC_RESET_PIN=4
    -DSBIP_LPC_ISP_PIN=5
    -DSBIP_ETH_SCK_PIN=12
    -DSBIP_ETH_MISO_PIN=13
    -DSBIP_ETH_MOSI_PIN=11
    -DSBIP_ETH_CS_PIN=10
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
monitor_filters = esp32_exception_decoder

; ESP32-S2. Works, but single core: WiFi and the KNX stack share one core, so
; the TP-UART receive path sees more jitter. Prefer S3 or C3 if you can choose.
[env:esp32s2]
board = esp32-s2-saola-1
build_flags =
    ${env.build_flags}
    -DSBIP_KNX_UART_NUM=1
    -DSBIP_KNX_RX_PIN=18
    -DSBIP_KNX_TX_PIN=17
    -DSBIP_LED_PIN=15
    -DSBIP_LED_ACTIVE_LOW=0
    -DSBIP_BUTTON_PIN=0
    -DSBIP_I2C_SDA_PIN=8
    -DSBIP_I2C_SCL_PIN=9
    -DSBIP_ETH_SCK_PIN=12
    -DSBIP_ETH_MISO_PIN=13
    -DSBIP_ETH_MOSI_PIN=11
    -DSBIP_ETH_CS_PIN=10
    ; USB_MODE=0 (native USB / TinyUSB), unlike the S3 above: the S2 has
    ; SOC_USB_OTG_SUPPORTED but no USB-Serial/JTAG controller, so the hardware
    ; CDC mode simply does not exist here. With =1 the core resolves Serial to
    ; HWCDCSerial and the build dies inside HardwareSerial.h.
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=1

; Not supported: ESP32-H2 has no WiFi radio at all (802.15.4 + BLE only) and
; ESP8266 lacks the RAM and the UART count for this firmware.
 
; ---------------------------------------------------------------------------
; 8 MB variants
;
; The DevKitC boards for S3 and C6 carry 8 MB, and WROOM-32 modules are sold
; with 8 and 16 MB as well. The three lines below are all it takes to use it -
; copy them into any env whose module is bigger than 4 MB.
;
; Only the two app slots grow; see partitions_8mb_ota.csv. Rebuilding with a
; different partition table is NOT an over-the-air change: the table sits
; outside every partition and only esptool writes it. A device already running
; the 4 MB layout has to be flashed over USB, and its KNX configuration is
; gone afterwards because knxcfg moves.
;
; 2 MB is not possible with OTA, and no trick changes that: two slots each
; need room for a whole image, and this firmware is about 1.6 MB. What fits
; into 2 MB is a single app partition without OTA - which also gives up the
; rollback that catches a bad update. Flashing over USB stays possible either
; way, so the trade is "no remote update" against "half the flash".
; ---------------------------------------------------------------------------

[env:esp32dev_8mb]
extends = env:esp32dev
board_build.partitions = partitions_8mb_ota.csv
board_upload.flash_size = 8MB

[env:esp32s3_8mb]
extends = env:esp32s3
board_build.partitions = partitions_8mb_ota.csv
board_upload.flash_size = 8MB

[env:esp32c6_8mb]
extends = env:esp32c6
board_build.partitions = partitions_8mb_ota.csv
board_upload.flash_size = 8MB
