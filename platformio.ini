; PlatformIO project configuration for the Selfbus KNXnet/IP interface.
;
; The KNX TP1 side is a Selfbus SB-Interface (LPC1115) running the TP-UART 2
; emulator from ../TPUART2-Emu. It is attached to a hardware UART of the ESP32
; at 19200 baud, 8E1.
;
; Deliberately NOT set (unlike NCN5130-based gateways):
;   -DNCN5120       the LPC1115 emulates a plain TP-UART 2, not an NCN512x.
;                   Setting it would make the stack expect U_Configure,
;                   marker mode, a baud rate switch to 38400 and the analog
;                   registers - none of which the emulator implements.
;   -DKNX_BAUDRATE  stays at the TP-UART 2 default of 19200.

[platformio]
src_dir = src
include_dir = include

[env]
; Arduino-ESP32 3.x is a hard requirement, not a preference:
;   * ETH.begin(ETH_PHY_W5500, ..., SPI, ...), ETH.hasIP() and ETH.setDefault()
;     used by src/eth_interface.cpp only exist from core 3.x on. Core 2.0.x
;     drives RMII PHYs only and cannot talk to a W5500 at all.
;   * WiFiUDP is a typedef on NetworkUDP there, which is what lets the KNX
;     stack run unchanged over Ethernet (see README).
;   * src/fw_hash.cpp calls the mbedTLS 3.x SHA-256 API (ESP-IDF 5.x).
; The registry's espressif32 platform still ships core 2.0.x, so the core 3.x
; builds are pulled from pioarduino. Bump the release tag to move core version.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
lib_ldf_mode = deep+
; framework_includes.py works around the core 3.x libraries not declaring
; their dependencies on each other - see the file header for details.
extra_scripts =
    pre:scripts/version_bump.py
    pre:scripts/framework_includes.py

board_build.partitions = partitions_4mb_ota.csv
board_upload.flash_size = 4MB

lib_deps =
    ; The KNX stack. Pin to a commit rather than a floating branch - the
    ; TpUartDataLinkLayer was rewritten upstream and the API used in
    ; src/knx_link.cpp (isConnected/getRx*Counter/reset) only exists in the
    ; new implementation.
    https://github.com/thelsing/knx.git#master
    ESP32Async/ESPAsyncWebServer @ ^3.6.0
    ESP32Async/AsyncTCP @ ^3.3.2
    https://github.com/jnthas/Improv-WiFi-Library.git

build_flags =
    ; KNXnet/IP router + tunnelling server (coupler mask 091A).
    ;
    ; KNX_TUNNELING is the number of concurrent tunnel connections. Each one
    ; needs its own individual address; while the device is unprogrammed the
    ; stack derives them from its own subnet (15.15.1 .. 15.15.n). Cost is
    ; about 24 bytes of RAM plus 7 bytes of property data per tunnel, so the
    ; practical limit is the address range, not the ESP32.
    -DMASK_VERSION=0x091A
    -DKNX_TUNNELING=10
    -DKNX_ROUTING
    ; Per-frame RX/TX notifications, used for the bus statistics on the
    ; dashboard. Without this the stack exposes frame counters only.
    -DKNX_ACTIVITYCALLBACK
    ; We create the KnxFacade ourselves in knx_link.cpp so the UART can be
    ; picked at runtime. KNX_SERIAL still has to be defined or esp32_platform
    ; emits a warning; the value is unused because we pass the port explicitly.
    -DKNX_NO_AUTOMATIC_GLOBAL_INSTANCE
    -DKNX_SERIAL=Serial1

[env:esp32dev]
board = esp32dev
build_flags =
    ${env.build_flags}
    -DSBIP_KNX_UART_NUM=2
    -DSBIP_KNX_RX_PIN=16
    -DSBIP_KNX_TX_PIN=17
    -DSBIP_LED_PIN=2
    -DSBIP_LED_ACTIVE_LOW=0
    -DSBIP_BUTTON_PIN=0
    -DSBIP_I2C_SDA_PIN=21
    -DSBIP_I2C_SCL_PIN=22
    ; Optional W5500 on VSPI. Probed at boot; without a chip these pins stay
    ; unused and the firmware falls back to WiFi.
    -DSBIP_ETH_SCK_PIN=18
    -DSBIP_ETH_MISO_PIN=19
    -DSBIP_ETH_MOSI_PIN=23
    -DSBIP_ETH_CS_PIN=5

[env:esp32c3]
board = seeed_xiao_esp32c3
; No Ethernet pins: the XIAO C3 breaks out 11 GPIOs and KNX-UART, I2C, LED and
; button already claim six of them. Wire a W5500 on a board with more pins, or
; drop I2C/RTC here and reassign.
build_flags =
    ${env.build_flags}
    -DSBIP_KNX_UART_NUM=1
    -DSBIP_KNX_RX_PIN=20
    -DSBIP_KNX_TX_PIN=21
    -DSBIP_LED_PIN=4
    -DSBIP_LED_ACTIVE_LOW=1
    -DSBIP_BUTTON_PIN=9
    -DSBIP_I2C_SDA_PIN=6
    -DSBIP_I2C_SCL_PIN=7
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:esp32c6]
board = esp32-c6-devkitc-1
; Ethernet pins intentionally unset - see the C3 note. The DevKitC has spare
; GPIOs, so add -DSBIP_ETH_* here if you fit a W5500.
build_flags =
    ${env.build_flags}
    -DSBIP_KNX_UART_NUM=1
    -DSBIP_KNX_RX_PIN=5
    -DSBIP_KNX_TX_PIN=4
    ; Same as the S3: GPIO 8 is the WS2812 RGB LED on the DevKitC-1, not a
    ; plain output. Disabled rather than pretending it works.
    -DSBIP_LED_PIN=-1
    -DSBIP_LED_ACTIVE_LOW=1
    -DSBIP_BUTTON_PIN=9
    -DSBIP_I2C_SDA_PIN=6
    -DSBIP_I2C_SCL_PIN=7
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
monitor_filters = esp32_exception_decoder

; ESP32-S3. Plenty of RAM and two free UARTs, the most comfortable target.
[env:esp32s3]
board = esp32-s3-devkitc-1
build_flags =
    ${env.build_flags}
    -DSBIP_KNX_UART_NUM=1
    -DSBIP_KNX_RX_PIN=18
    -DSBIP_KNX_TX_PIN=17
    ; No plain status LED on this board: GPIO 48 carries the WS2812 RGB LED,
    ; which needs a timed serial protocol - digitalWrite() does nothing
    ; visible there. -1 disables the indicator; for a real one pick a free
    ; GPIO (47 is unused) and wire an LED with a series resistor.
    -DSBIP_LED_PIN=-1
    -DSBIP_LED_ACTIVE_LOW=0
    -DSBIP_BUTTON_PIN=0
    -DSBIP_I2C_SDA_PIN=8
    -DSBIP_I2C_SCL_PIN=9
    -DSBIP_ETH_SCK_PIN=12
    -DSBIP_ETH_MISO_PIN=13
    -DSBIP_ETH_MOSI_PIN=11
    -DSBIP_ETH_CS_PIN=10
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
monitor_filters = esp32_exception_decoder

; ESP32-S2. Works, but single core: WiFi and the KNX stack share one core, so
; the TP-UART receive path sees more jitter. Prefer S3 or C3 if you can choose.
[env:esp32s2]
board = esp32-s2-saola-1
build_flags =
    ${env.build_flags}
    -DSBIP_KNX_UART_NUM=1
    -DSBIP_KNX_RX_PIN=18
    -DSBIP_KNX_TX_PIN=17
    -DSBIP_LED_PIN=15
    -DSBIP_LED_ACTIVE_LOW=0
    -DSBIP_BUTTON_PIN=0
    -DSBIP_I2C_SDA_PIN=8
    -DSBIP_I2C_SCL_PIN=9
    -DSBIP_ETH_SCK_PIN=12
    -DSBIP_ETH_MISO_PIN=13
    -DSBIP_ETH_MOSI_PIN=11
    -DSBIP_ETH_CS_PIN=10
    ; USB_MODE=0 (native USB / TinyUSB), unlike the S3 above: the S2 has
    ; SOC_USB_OTG_SUPPORTED but no USB-Serial/JTAG controller, so the hardware
    ; CDC mode simply does not exist here. With =1 the core resolves Serial to
    ; HWCDCSerial and the build dies inside HardwareSerial.h.
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=1

; Not supported: ESP32-H2 has no WiFi radio at all (802.15.4 + BLE only) and
; ESP8266 lacks the RAM and the UART count for this firmware.
